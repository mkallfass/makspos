name: maven build

on: [push]

jobs:
  webui-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/main/webui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    # Quinoa builds the frontend but never runs its tests, so gate the deploy on them
    needs: webui-tests
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Log in to the ghcr.io container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # -DskipITs=false: integration tests are off by default, so without this the packaged
      # artifact would never be smoke-tested and IT regressions would go unnoticed
      - name: Build, deploy and push container image with Maven
        run: ./mvnw --batch-mode --update-snapshots -DskipITs=false -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The integration tests launch the packaged jar on the runner (see pom.xml), so the image is
      # smoke-tested separately: start it like a user would and wait for it to report ready
      - name: Smoke-test the container image
        run: |
          image=$(sed -n 's/^metadata\.container-image=//p' target/quarkus-artifact.properties | tr -d '\\')
          echo "Smoke-testing $image"
          docker run --rm --detach --name makspos-smoke --publish 8080:8080 "$image"
          trap 'status=$?; [ "$status" -eq 0 ] || docker logs makspos-smoke; docker stop makspos-smoke >/dev/null; exit "$status"' EXIT
          curl --fail --silent --show-error --output /dev/null \
            --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://localhost:8080/q/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/
