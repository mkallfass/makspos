name: maven build

on: [push]

jobs:
  webui-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/main/webui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    # Quinoa builds the frontend but never runs its tests, so gate the deploy on them
    needs: webui-tests
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Log in to the ghcr.io container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, deploy and push container image with Maven
        run: ./mvnw --batch-mode --update-snapshots -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
